<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris, France</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }
        #map {
            height: 400px;
            width: 100%;
            margin-top: 20px;
        }
        .attraction {
            margin-bottom: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <h1>Paris, France</h1>

    <img src="https://image.pollinations.ai/prompt/Paris%2C%20France%20landmark?seed=1" alt="Paris Landmark 1">
    <img src="https://image.pollinations.ai/prompt/Paris%2C%20France%20landmark?seed=2" alt="Paris Landmark 2">
    <img src="https://image.pollinations.ai/prompt/Paris%2C%20France%20landmark?seed=3" alt="Paris Landmark 3">

    <h2>Top Attractions</h2>

    <div id="map"></div>

    <script>
        var map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var attractions = [
            { name: "Eiffel Tower", lat: 48.8584, lon: 2.2945, rating: 4.7 },
            { name: "Louvre Museum", lat: 48.8606, lon: 2.3376, rating: 4.6 },
            { name: "Arc de Triomphe", lat: 48.8728, lon: 2.3021, rating: 4.5 },
            { name: "Notre-Dame Cathedral", lat: 48.8530, lon: 2.3499, rating: 4.4 },
            { name: "Sainte-Chapelle", lat: 48.8555, lon: 2.3415, rating: 4.8 }
        ];

        attractions.forEach(function(attraction) {
            L.marker([attraction.lat, attraction.lon])
                .addTo(map)
                .bindPopup(attraction.name + "<br>Rating: " + attraction.rating + "/5");
        });

        map.fitBounds([
            [48.8530, 2.3376],
            [48.8728, 2.3522]
        ]);
    </script>
</body>
</html>
