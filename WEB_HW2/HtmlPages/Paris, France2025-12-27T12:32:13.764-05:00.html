<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNKNOWN_CITY</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        #map {
            height: 400px;
            width: 100%;
        }
        .attraction {
            margin-bottom: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <h1>UNKNOWN_CITY</h1>

    <img src="https://image.pollinations.ai/prompt/UNKNOWN_CITY%20landmark?seed=1" alt="UNKNOWN_CITY Landmark 1" width="300">
    <img src="https://image.pollinations.ai/prompt/UNKNOWN_CITY%20landmark?seed=2" alt="UNKNOWN_CITY Landmark 2" width="300">
    <img src="https://image.pollinations.ai/prompt/UNKNOWN_CITY%20landmark?seed=3" alt="UNKNOWN_CITY Landmark 3" width="300">

    <h2>Top Attractions</h2>

    <div id="map"></div>

    <script>
        var map = L.map('map').setView([51.505, -0.09], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var attractions = [
            { name: "The Grand Museum", lat: 51.507, lon: -0.09, rating: 4.7 },
            { name: "Royal Gardens", lat: 51.511, lon: -0.08, rating: 4.5 },
            { name: "Historic Castle", lat: 51.502, lon: -0.10, rating: 4.9 },
            { name: "City Art Gallery", lat: 51.520, lon: -0.07, rating: 4.3 },
            { name: "Central Park", lat: 51.495, lon: -0.12, rating: 4.6 }
        ];

        attractions.forEach(function(attraction) {
            var marker = L.marker([attraction.lat, attraction.lon]).addTo(map);
            marker.bindPopup(attraction.name + " - Rating: " + attraction.rating + "/5");
        });

        map.fitBounds([
            [51.495, -0.12],
            [51.520, -0.07]
        ]);
    </script>
</body>
</html>
